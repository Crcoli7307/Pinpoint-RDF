name: Build and Release (Windows)

on:
  push:
    branches:
      - main

jobs:
  build-release:
    runs-on: windows-latest
    env:
      PYTHON_EXE: 'C:\Users\Administrator\AppData\Local\Programs\Python\Python311\python.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        shell: powershell
        run: |
          $content = Get-Content main.py -Raw
          if ($content -match 'APP_VERSION\s*=\s*"([^"]+)"') {
            $version = $matches[1]
          } else {
            throw "APP_VERSION not found in main.py"
          }
          $sha = $env:GITHUB_SHA
          if (-not $sha) {
            throw "GITHUB_SHA not set"
          }
          $short = if ($sha.Length -ge 8) { $sha.Substring(0, 8) } else { $sha }
          "PINPOINT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PINPOINT_VERSION_TAG=$version+$short" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify Python (preinstalled)
        shell: powershell
        run: |
          & $env:PYTHON_EXE --version
          & $env:PYTHON_EXE -m pip --version

      - name: Install dependencies
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m pip install --upgrade pip
          & $env:PYTHON_EXE -m pip install -r requirements.txt
          & $env:PYTHON_EXE -m pip install pyinstaller

      - name: Build exe (PyInstaller)
        shell: powershell
        run: |
          $cmd = Get-Content compile_command.txt -Raw
          # Drop --add-data entries for gitignored or missing sources.
          $cmd = [regex]::Replace($cmd, '--add-data\s+"([^"]+)"', {
            param($m)
            $pair = $m.Groups[1].Value
            $src = $pair.Split(';', 2)[0]
            $ignored = $false
            try {
              git check-ignore -q -- $src
              if ($LASTEXITCODE -eq 0) { $ignored = $true }
            } catch {
              $ignored = $false
            }
            if ($ignored) {
              Write-Host "Skipping gitignored data: $src"
              return ''
            }
            if (-not (Test-Path $src)) {
              Write-Host "Skipping missing data: $src"
              return ''
            }
            return $m.Value
          })
          $cmd = $cmd -replace '\s{2,}', ' '
          $py = $env:PYTHON_EXE
          $cmd = $cmd -replace '^\s*pyinstaller\b', "`"$py`" -m PyInstaller"
          Write-Host "Running: $cmd"
          cmd /c $cmd

      - name: Verify build output
        shell: powershell
        run: |
          if (-not (Test-Path "dist/Pinpoint.exe")) {
            throw "Build output not found: dist/Pinpoint.exe"
          }

      - name: Create release and upload exe
        uses: https://git.bjxgj.com/actions/gitea-release-action@v1
        with:
          tag_name: ${{ env.PINPOINT_VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          name: Pinpoint ${{ env.PINPOINT_VERSION }}
          files: dist/Pinpoint.exe
          server_url: ${{ github.server_url }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITEA_TOKEN }}
