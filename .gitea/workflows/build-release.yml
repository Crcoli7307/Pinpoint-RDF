name: Build and Release (Windows)

on:
  push:
    branches:
      - main

jobs:
  build-release:
    runs-on: windows-latest
    env:
      PYTHON_EXE: 'C:\Users\Administrator\AppData\Local\Programs\Python\Python311\python.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: powershell
        run: |
          $versionFile = "pinpoint/version.py"
          if (-not (Test-Path $versionFile)) {
            $versionFile = "main.py"
          }
          $content = Get-Content $versionFile -Raw
          if ($content -match "APP_VERSION\s*=\s*['`"]([^'`"]+)['`"]") {
            $version = $matches[1]
          } else {
            throw "APP_VERSION not found in $versionFile"
          }
          $sha = $env:GITHUB_SHA
          if (-not $sha) { $sha = "${{ github.sha }}" }
          if (-not $sha) { $sha = (git rev-parse HEAD).Trim() }
          $short = if ($sha.Length -ge 8) { $sha.Substring(0, 8) } else { $sha }
          $tag = "$version-$short"
          $releaseName = "Pinpoint Release $version"
          Write-Host "Resolved app version: $version"
          Write-Host "Resolved release tag: $tag"
          Write-Host "Resolved release name: $releaseName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_name=$releaseName" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "PINPOINT_VERSION=$version" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "PINPOINT_VERSION_TAG=$tag" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "PINPOINT_RELEASE_NAME=$releaseName" -Encoding utf8

      - name: Verify Python (preinstalled)
        shell: powershell
        run: |
          & $env:PYTHON_EXE --version
          & $env:PYTHON_EXE -m pip --version

      - name: Install dependencies
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m pip install --upgrade pip
          & $env:PYTHON_EXE -m pip install -r requirements.txt
          & $env:PYTHON_EXE -m pip install nuitka

      - name: Build exe (Nuitka)
        shell: powershell
        run: |
          $cmd = Get-Content compile_command.txt -Raw
          $iconPath = Resolve-Path "app.ico" -ErrorAction SilentlyContinue
          if ($iconPath) {
            $iconPath = $iconPath.Path
            if ($cmd -match '--windows-icon-from-ico(=|\s+)') {
              $cmd = [regex]::Replace($cmd, '--windows-icon-from-ico(=|\s+)"?([^"\s]+)"?', {
                param($m)
                return "--windows-icon-from-ico=`"$iconPath`""
              })
            } else {
              $cmd = "$cmd --windows-icon-from-ico=`"$iconPath`""
            }
            Write-Host "Using icon: $iconPath"
          } else {
            Write-Host "app.ico not found; skipping icon override."
          }
          # Drop --include-data-files/dir entries for gitignored or missing sources.
          $cmd = [regex]::Replace($cmd, '--include-data-(files|dir)=(\"[^\"]+\"|\S+)', {
            param($m)
            $pair = $m.Groups[2].Value.Trim('"')
            $src = $pair.Split('=', 2)[0]
            $ignored = $false
            try {
              git check-ignore -q -- $src
              if ($LASTEXITCODE -eq 0) { $ignored = $true }
            } catch {
              $ignored = $false
            }
            if ($ignored) {
              Write-Host "Skipping gitignored data: $src"
              return ''
            }
            if (-not (Test-Path $src)) {
              Write-Host "Skipping missing data: $src"
              return ''
            }
            return $m.Value
          })
          $cmd = $cmd -replace '\s{2,}', ' '
          $py = $env:PYTHON_EXE
          $cmd = $cmd -replace '^\s*nuitka\b', "`"$py`" -m nuitka"
          Write-Host "Running: $cmd"
          cmd /c $cmd

      - name: Verify build output
        shell: powershell
        run: |
          if (-not (Test-Path "dist/Pinpoint.exe")) {
            throw "Build output not found: dist/Pinpoint.exe"
          }

      - name: Sign exe (local certificate)
        shell: powershell
        run: |
          $thumbprint = "A2DD8F69432ECB77BDEDBC4F43156B21F92077AB"
          $exePath = Resolve-Path "dist/Pinpoint.exe" -ErrorAction Stop

          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $candidate = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($candidate) { $signtool = $candidate.FullName }
          }
          if (-not $signtool) {
            throw "signtool.exe not found. Install Windows SDK on the runner."
          }

          $machineCert = Get-Item "Cert:\LocalMachine\My\$thumbprint" -ErrorAction SilentlyContinue
          $userCert = Get-Item "Cert:\CurrentUser\My\$thumbprint" -ErrorAction SilentlyContinue
          if (-not $machineCert -and -not $userCert) {
            throw "Code signing certificate $thumbprint not found in LocalMachine or CurrentUser store."
          }

          $baseArgs = @("sign", "/sha1", $thumbprint, "/fd", "SHA256")
          if ($machineCert) { $baseArgs += "/sm" }

          $timestampUrl = "http://timestamp.digicert.com"
          $timestampArgs = $baseArgs + @("/td", "SHA256", "/tr", $timestampUrl, $exePath.Path)
          Write-Host "Signing with timestamp..."
          & $signtool @timestampArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Timestamp signing failed; retrying without timestamp..."
            & $signtool @($baseArgs + @($exePath.Path))
            if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed."
            }
          }

          Write-Host "Verifying signature..."
          & $signtool verify /pa /v $exePath.Path
          if ($LASTEXITCODE -ne 0) {
            throw "signtool verify failed."
          }

      - name: Create release and upload exe
        uses: https://git.bjxgj.com/actions/gitea-release-action@v1
        with:
          tag_name: ${{ env.PINPOINT_VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.PINPOINT_RELEASE_NAME }}
          files: dist/Pinpoint.exe
          server_url: ${{ github.server_url }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITEA_TOKEN }}
